services:
  sanflow:
    build:
      context: .
    image: sanflow:latest
    container_name: sanflow
    restart: unless-stopped
    env_file:
      - ${SANFLOW_ENV_FILE:-.env}
    ports:
      - "8080:8080"
    volumes:
      - sanflow_data:/data
      - sanflow_logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sanflow_data:
  sanflow_logs:
