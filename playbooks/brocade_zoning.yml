---
- name: Configure Fibre Channel zoning on Brocade through the REST API
  hosts: brocade_switches
  gather_facts: false
  connection: local
  vars:
    api_headers:
      Accept: application/yang-data+json
      Content-Type: application/yang-data+json
    vf_query: "?vf-id={{ fabric_id | default(128) }}"

  tasks:
    - name: Run zoning transaction
      block:
        - name: Open a Fabric OS REST session
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/login"
            method: POST
            url_username: "{{ switch_username }}"
            url_password: "{{ switch_password }}"
            force_basic_auth: true
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ api_headers }}"
            status_code: 200
            return_content: false
          register: fos_login
          no_log: true

        - name: Store the session token without displaying it
          ansible.builtin.set_fact:
            session_headers: >-
              {{ api_headers | combine({'Authorization': fos_login.authorization}) }}
          no_log: true

        - name: Check whether the zone already exists
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/defined-configuration/zone/zone-name/{{ zone_name | urlencode }}{{ vf_query }}"
            method: GET
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            status_code: [200, 404]
            return_content: true
          register: existing_zone
          no_log: true

        - name: Record zone presence
          ansible.builtin.set_fact:
            zone_exists: "{{ existing_zone.status == 200 }}"
          no_log: true

        - name: Create a standard zone with initiator and target WWPNs
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/defined-configuration/zone{{ vf_query }}"
            method: POST
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            body_format: json
            body:
              zone:
                zone-name: "{{ zone_name }}"
                zone-type-string: zone
                member-entry:
                  entry-name: "{{ zone_members }}"
            status_code: [201, 204]
          when:
            - not zone_exists | bool
            - not peer_zoning | bool
          no_log: true

        - name: Create a peer zone with principal targets
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/defined-configuration/zone{{ vf_query }}"
            method: POST
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            body_format: json
            body:
              zone:
                zone-name: "{{ zone_name }}"
                zone-type-string: user-created-peer-zone
                member-entry:
                  entry-name: "{{ zone_members }}"
                  principal-entry-name: "{{ zone_principal_members }}"
            status_code: [201, 204]
          when:
            - not zone_exists | bool
            - peer_zoning | bool
          no_log: true

        - name: Query defined configurations
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/defined-configuration/cfg{{ vf_query }}"
            method: GET
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            status_code: 200
            return_content: true
          register: defined_configs
          no_log: true

        - name: Identify the selected configuration
          ansible.builtin.set_fact:
            selected_cfg: >-
              {{ defined_configs.json.Response.cfg | default(defined_configs.json.cfg)
                 | default([]) | selectattr('cfg-name', 'equalto', zone_config)
                 | list | first | default({}) }}
          no_log: true

        - name: Prevent activation of a missing configuration
          ansible.builtin.assert:
            that:
              - selected_cfg | length > 0
            fail_msg: "Configuration {{ zone_config }} does not exist on the switch. Register the correct active cfg."

        - name: Calculate members while preserving existing zones
          ansible.builtin.set_fact:
            config_zone_names: >-
              {{ ((selected_cfg['member-zone']['zone-name']
                   if selected_cfg.get('member-zone') else []) + [zone_name]) | unique | list }}
          no_log: true

        - name: Add the zone to the defined configuration
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/defined-configuration/cfg{{ vf_query }}"
            method: PATCH
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            body_format: json
            body:
              cfg:
                cfg-name: "{{ zone_config }}"
                member-zone:
                  zone-name: "{{ config_zone_names }}"
            status_code: 204
          when: zone_name not in (selected_cfg.get('member-zone', {}).get('zone-name', []))
          no_log: true

        - name: Query the ZoneDB checksum
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/effective-configuration/checksum{{ vf_query }}"
            method: GET
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            status_code: 200
            return_content: true
          register: effective_configuration
          no_log: true

        - name: Extract the ZoneDB checksum
          ansible.builtin.set_fact:
            zone_checksum: >-
              {{ effective_configuration.json.Response['effective-configuration'].checksum
                 | default(effective_configuration.json['effective-configuration'].checksum) }}
          no_log: true

        - name: Save the ZoneDB transaction on FOS up to 9.1
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/effective-configuration/cfg-action/1{{ vf_query }}"
            method: PATCH
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            body_format: json
            body:
              checksum: "{{ zone_checksum }}"
            status_code: 204
          when:
            - fos_generation is version('9.2', '<')
            - (not zone_exists | bool) or (zone_name not in (selected_cfg.get('member-zone', {}).get('zone-name', [])))
          no_log: true

        - name: Save the ZoneDB transaction on FOS 9.2+
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/effective-configuration/cfg-action-v2/save{{ vf_query }}"
            method: PATCH
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            body_format: json
            body:
              checksum: "{{ zone_checksum }}"
            status_code: 204
          when:
            - fos_generation is version('9.2', '>=')
            - (not zone_exists | bool) or (zone_name not in (selected_cfg.get('member-zone', {}).get('zone-name', [])))
          no_log: true

        - name: Query the checksum again before activation
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/effective-configuration/checksum{{ vf_query }}"
            method: GET
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            status_code: 200
            return_content: true
          register: effective_after_save
          when: activate_config | bool
          no_log: true

        - name: Activate the selected zoning configuration
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/effective-configuration/cfg-name/{{ zone_config | urlencode }}{{ vf_query }}"
            method: PATCH
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            body_format: json
            body:
              checksum: >-
                {{ effective_after_save.json.Response['effective-configuration'].checksum
                   | default(effective_after_save.json['effective-configuration'].checksum) }}
            status_code: 204
          when: activate_config | bool
          no_log: true

        - name: Record a safe change summary
          ansible.builtin.debug:
            msg: "Zone {{ zone_name }} processed in {{ zone_config }} with {{ zone_members | length }} members"

      rescue:
        - name: Abort a pending transaction on FOS up to 9.1
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/effective-configuration/cfg-action/4{{ vf_query }}"
            method: PATCH
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            status_code: [204, 400, 409]
          when:
            - session_headers is defined
            - fos_generation is version('9.2', '<')
          failed_when: false
          no_log: true

        - name: Abort a pending transaction on FOS 9.2+
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/running/brocade-zone/effective-configuration/cfg-action-v2/transaction-abort{{ vf_query }}"
            method: PATCH
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers }}"
            status_code: [204, 400, 409]
          when:
            - session_headers is defined
            - fos_generation is version('9.2', '>=')
          failed_when: false
          no_log: true

        - name: End the play with the original zoning failure
          ansible.builtin.fail:
            msg: "The zoning transaction failed and a safe abort was attempted."

      always:
        - name: Close the Fabric OS REST session
          ansible.builtin.uri:
            url: "{{ switch_api_url }}/rest/logout"
            method: POST
            validate_certs: "{{ verify_ssl | bool }}"
            headers: "{{ session_headers | default(api_headers) }}"
            status_code: [200, 204, 401]
          when: fos_login is defined and fos_login.authorization is defined
          no_log: true
